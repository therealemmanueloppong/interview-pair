server:
  port: ${PORT:8080}

spring:
  application:
    name: interviewpair
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/interviewpair}
    username: ${DB_USER:interviewpair}
    password: ${DB_PASSWORD:interviewpair}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  jwt:
    # Required. Use a long random value (32+ characters) and never commit it.
    secret: ${JWT_SECRET}
    ttl: ${JWT_TTL:PT1H}

management:
  endpoints:
    web:
      exposure:
        include: health,info

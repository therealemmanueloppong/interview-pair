server:
  port: ${PORT:8080}

spring:
  application:
    name: interviewpair
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/interviewpair}
    username: ${DB_USER:interviewpair}
    password: ${DB_PASSWORD:interviewpair}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
